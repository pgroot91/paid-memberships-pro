name: 'Codeception & WordPress Tests'

on:
  pull_request:
    paths:
      - '*/**.php'
      - 'tests/**'
      - '*.php'
      - 'composer.json'
      - 'codeception.*.yml'
      - '.github/workflows/tests-php.yml'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        suite:
          - wpunit
          - acceptance
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------------------------
      # Checkout the repository and TRIC
      # --------------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Checkout TRIC
        uses: actions/checkout@v2
        with:
          repository: the-events-calendar/tric
          ref: main
          path: tric
          fetch-depth: 1

      # --------------------------------------------------------------------------
      # Prepare Composer cache
      # --------------------------------------------------------------------------
      - name: Get Composer cache directory
        id: get-composer-cache-dir
        run: echo "::set-output name=dir::$(composer config cache-files-dir)"

      - uses: actions/cache@v3
        id: composer-cache
        with:
          path: ${{ steps.get-composer-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # --------------------------------------------------------------------------
      # Set TRIC environment variables
      # --------------------------------------------------------------------------
      - name: Set up TRIC environment
        run: |
          echo "TRIC_BIN=${GITHUB_WORKSPACE}/tric/tric" >> $GITHUB_ENV
          echo "TRIC_WP_DIR=${GITHUB_WORKSPACE}/tric/_wordpress" >> $GITHUB_ENV
          echo "TRIC_WORDPRESS_DOCKERFILE=Dockerfile.base" >> $GITHUB_ENV
          echo "TRIC=1" >> $GITHUB_ENV
          echo "CI=1" >> $GITHUB_ENV

      # --------------------------------------------------------------------------
      # Start ssh-agent (required by TRIC/SLIC)
      # --------------------------------------------------------------------------
      - name: Start ssh-agent
        run: |
          mkdir -p "${HOME}/.ssh"
          ssh-agent -a /tmp/ssh_agent.sock
          echo "SSH_AUTH_SOCK=/tmp/ssh_agent.sock" >> $GITHUB_ENV

      # --------------------------------------------------------------------------
      # Initialize TRIC
      # --------------------------------------------------------------------------
      - name: Initialize TRIC for CI
        run: |
          cd ${GITHUB_WORKSPACE}/..
          ${TRIC_BIN} here
          ${TRIC_BIN} interactive off
          ${TRIC_BIN} build-prompt off
          ${TRIC_BIN} build-subdir off
          ${TRIC_BIN} xdebug off
          ${TRIC_BIN} composer-cache set /home/runner/.cache/composer
          ${TRIC_BIN} debug on
          ${TRIC_BIN} info
          ${TRIC_BIN} config

      # --------------------------------------------------------------------------
      # Start plugin container first (required for composer/vendor)
      # --------------------------------------------------------------------------
      - name: Start plugin container
        run: ${TRIC_BIN} up

      # --------------------------------------------------------------------------
      # Install plugin dependencies inside the container
      # --------------------------------------------------------------------------
      - name: Install plugin dependencies
        run: |
          ${TRIC_BIN} use paid-memberships-pro
          ${TRIC_BIN} shell --command "composer install --no-interaction --prefer-dist --no-progress"

      # --------------------------------------------------------------------------
      # Verify Codeception binary exists
      # --------------------------------------------------------------------------
      - name: Verify Codeception
        run: |
          ${TRIC_BIN} shell --command "[ -f vendor/bin/codecept ] && echo 'Codeception OK' || (echo 'Codeception missing' && exit 1)"

      # --------------------------------------------------------------------------
      # Start WordPress container
      # --------------------------------------------------------------------------
      - name: Start WordPress container
        run: |
          ${TRIC_BIN} up wordpress
          ${TRIC_BIN} site-cli core version

      # --------------------------------------------------------------------------
      # Install and activate TwentyTwenty theme for acceptance tests
      # --------------------------------------------------------------------------
      - name: Install and activate TwentyTwenty
        if: ${{ matrix.suite == 'acceptance' }}
        run: ${TRIC_BIN} site-cli theme install twentytwenty --activate

      # --------------------------------------------------------------------------
      # Run the test suite
      # --------------------------------------------------------------------------
      - name: Run Codeception suite
        run: ${TRIC_BIN} run ${{ matrix.suite }} --ext DotReporter

      # --------------------------------------------------------------------------
      # Upload artifacts (screenshots, logs) if tests fail
      # --------------------------------------------------------------------------
      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ matrix.suite }}
          path: tests/_output/
          retention-days: 7
