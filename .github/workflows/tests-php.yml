name: 'Codeception Tests'

on:
  pull_request:
    paths:
      - '*/**.php'
      - 'tests/**'
      - '*.php'
      - 'composer.json'
      - 'codeception.*.yml'
      - '.github/workflows/tests-php.yml'
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        suite:
          - wpunit
          - acceptance
    runs-on: ubuntu-latest
    steps:
      # ----------------------------------------------------------------------
      # Checkout repo and Tric
      # ----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Checkout Tric
        uses: actions/checkout@v2
        with:
          repository: the-events-calendar/tric
          ref: main
          path: tric
          fetch-depth: 1

      # ----------------------------------------------------------------------
      # Composer cache
      # ----------------------------------------------------------------------
      - name: Get Composer Cache Directory
        id: get-composer-cache-dir
        run: echo "::set-output name=dir::$(composer config cache-files-dir)"

      - uses: actions/cache@v3
        id: composer-cache
        with:
          path: ${{ steps.get-composer-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # ----------------------------------------------------------------------
      # Set up Tric environment
      # ----------------------------------------------------------------------
      - name: Set up Tric env vars
        run: |
          echo "TRIC_BIN=${GITHUB_WORKSPACE}/tric/tric" >> $GITHUB_ENV
          echo "TRIC_WP_DIR=${GITHUB_WORKSPACE}/tric/_wordpress" >> $GITHUB_ENV
          echo "TRIC_WORDPRESS_DOCKERFILE=Dockerfile.base" >> $GITHUB_ENV
          echo "TRIC=1" >> $GITHUB_ENV
          echo "CI=1" >> $GITHUB_ENV

      - name: Start ssh-agent
        run: |
          mkdir -p "${HOME}/.ssh"
          ssh-agent -a /tmp/ssh_agent.sock
          echo "SSH_AUTH_SOCK=/tmp/ssh_agent.sock" >> $GITHUB_ENV

      - name: Set up Tric for CI
        run: |
          cd ${GITHUB_WORKSPACE}/..
          ${TRIC_BIN} here
          ${TRIC_BIN} interactive off
          ${TRIC_BIN} build-prompt off
          ${TRIC_BIN} build-subdir off
          ${TRIC_BIN} xdebug off
          ${TRIC_BIN} composer-cache set /home/runner/.cache/composer
          ${TRIC_BIN} debug on
          ${TRIC_BIN} info
          ${TRIC_BIN} config

      # ----------------------------------------------------------------------
      # Start containers
      # ----------------------------------------------------------------------
      - name: Start DB container
        run: ${TRIC_BIN} up db

      - name: Set Tric target
        run: ${TRIC_BIN} use paid-memberships-pro

      - name: Wait for DB to be ready
        run: |
          ${TRIC_BIN} exec db bash -c "until mysqladmin ping -h db -u root -ppassword --silent; do sleep 2; done"

      - name: Start WordPress container
        run: ${TRIC_BIN} up wordpress

      - name: Wait for WordPress to be ready
        run: |
          ${TRIC_BIN} exec wordpress bash -c "until wp core is-installed --allow-root; do sleep 2; done"

      - name: Start Chrome container (acceptance only)
        if: ${{ matrix.suite == 'acceptance' }}
        run: ${TRIC_BIN} up chrome

      # ----------------------------------------------------------------------
      # Install dependencies
      # ----------------------------------------------------------------------
      - name: Install plugin dependencies
        run: ${TRIC_BIN} composer install --dev

      # ----------------------------------------------------------------------
      # Load environment variables for Codeception
      # ----------------------------------------------------------------------
      - name: Load Codeception env
        run: export $(grep -v '^#' .env.testing.tric | xargs)

      # ----------------------------------------------------------------------
      # Install and activate TwentyTwenty theme (acceptance only)
      # ----------------------------------------------------------------------
      - name: Install TwentyTwenty theme
        if: ${{ matrix.suite == 'acceptance' }}
        run: ${TRIC_BIN} site-cli theme install twentytwenty --activate

      # ----------------------------------------------------------------------
      # Run Codeception tests
      # ----------------------------------------------------------------------
      - name: Run suite tests
        run: ${TRIC_BIN} run ${{ matrix.suite }} --ext DotReporter

      # ----------------------------------------------------------------------
      # Upload artifacts on failure
      # ----------------------------------------------------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: output ${{ matrix.suite }}
          path: tests/_output/
          retention-days: 7
