name: E2E Tests

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - "**"

jobs:
  cypress:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["7.4", "8.3"]
        browser: ["chrome", "firefox"]
      
    services:
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd="wget --spider -q http://localhost:8025 || exit 1"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=10

    steps:
      - name: Wait for Mailpit
        run: |
          for i in {1..20}; do
            if curl -s http://localhost:8025 > /dev/null; then
              echo "Mailpit is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Mailpit did not start"
          exit 1

      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Cache NPM dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-cache

      - name: Install NPM dependencies
        run: npm ci

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-cache

      - name: Install Composer dependencies
        run: composer install

      - name: Set PHP version for wp-env
        run: |
          echo "{\"config\": {\"phpVersion\": \"${{ matrix.php }}\"}}" > .wp-env.override.json

      - name: Start WordPress Environment
        run: npm run env:start

      - name: Wait for WordPress to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8889 | grep -q "WordPress"; then
              echo "WordPress is ready";
              break;
            fi
            echo "Waiting for WordPress... ($i/30)";
            sleep 5;
          done

      - name: Run Cypress Tests in ${{ matrix.browser }}
        id: tests
        run: |
          # Find the WordPress test container
          WP_CONTAINER=$(docker ps --format "{{.ID}} {{.Names}}" | grep "\-tests-wordpress-1" | awk '{print $1}')
          if [ -z "$WP_CONTAINER" ]; then
            echo "Cannot find WordPress container. Exiting."
            exit 1
          fi

          # Detect the Docker network attached to WordPress container
          WP_NETWORK=$(docker inspect "$WP_CONTAINER" --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}')
          if [ -z "$WP_NETWORK" ]; then
            echo "Cannot detect WordPress network. Exiting."
            exit 1
          fi

          echo "Using WordPress network: $WP_NETWORK"

          # Run Cypress on the same network
          docker run --rm \
            --network "$WP_NETWORK" \
            -e CYPRESS_BASE_URL=http://localhost:8889 \
            -v ${{ github.workspace }}:/e2e \
            -w /e2e \
            cypress/included:latest \
            --browser ${{ matrix.browser }} \
            --config-file cypress.config.test.js \
            --config baseUrl=http://localhost:8889

      - name: Fix permissions for Cypress output
        if: always()
        run: sudo chown -R $USER:$USER tests/e2e/cypress

      - name: Upload Cypress screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ matrix.php }}-${{ matrix.browser }}
          path: tests/e2e/cypress/reports/screenshots

      - name: Upload Cypress videos
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos-${{ matrix.php }}-${{ matrix.browser }}
          path: tests/e2e/cypress/reports/videos

      - name: Fail job if tests failed
        if: failure()
        run: |
          echo "❌ One or more e2e tests failed."
          exit 1

      - name: Stop WordPress Environment
        if: always()
        run: npm run env:stop