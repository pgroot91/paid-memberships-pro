name: E2E Tests

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - "**"

jobs:
  cypress:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["7.4", "8.3"]
        browser: ["chrome", "firefox"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Cache NPM dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-cache

      - name: Install NPM dependencies
        run: npm ci

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-cache

      - name: Install Composer dependencies
        run: composer install

      - name: Set PHP version for wp-env
        run: |
          echo "{\"config\": {\"phpVersion\": \"${{ matrix.php }}\"}}" > .wp-env.override.json

      - name: Start full Docker environment
        run: npm run env:run:all

      - name: Get test WordPress container IP
        id: wp_ip
        run: |
          WP_CONTAINER=$(docker ps --filter "name=-tests-wordpress-1" --format "{{.Names}}")
          if [ -z "$WP_CONTAINER" ]; then
            echo "❌ Cannot find test WordPress container"
            exit 1
          fi
          WP_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $WP_CONTAINER)
          echo "Test WordPress container: $WP_CONTAINER"
          echo "Test WordPress IP: $WP_IP"
          echo "WP_IP=$WP_IP" >> $GITHUB_ENV

      - name: Run Cypress Tests in ${{ matrix.browser }}
        run: |
          npx cypress run \
            --browser ${{ matrix.browser }} \
            --config-file cypress.config.test.js

      - name: Fix permissions for Cypress output
        if: always()
        run: sudo chown -R $USER:$USER tests/e2e/cypress

      - name: Upload Cypress screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ matrix.php }}-${{ matrix.browser }}
          path: tests/e2e/cypress/reports/screenshots

      - name: Upload Cypress videos
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos-${{ matrix.php }}-${{ matrix.browser }}
          path: tests/e2e/cypress/reports/videos

      - name: Fail job if tests failed
        if: failure()
        run: |
          echo "❌ One or more e2e tests failed."
          exit 1

      - name: Stop WordPress Environment
        if: always()
        run: npm run env:stop
