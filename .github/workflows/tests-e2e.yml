name: E2E Tests

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - "**"

jobs:
  wp-env-prebuild:
    name: Prebuild WordPress Environment
    runs-on: ubuntu-latest
    outputs:
      wp-env-cache-key: prebuilt-wp-env
    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci --engine-strict=false
      - run: composer install

      - name: Start wp-env once to initialize DB & plugins
        run: |
          npm run env:start
          sleep 10
          npm run env:stop

      - name: Prebuild wp-env Docker image with DB
        run: |
          docker commit $(docker ps -alq) wp-env-prebuilt:latest
          mkdir -p docker-cache
          docker save wp-env-prebuilt:latest -o docker-cache/wp-env-images.tar

      - name: Cache wp-env Docker image
        uses: actions/cache@v3
        with:
          path: docker-cache/wp-env-images.tar
          key: wp-env-docker-${{ github.ref_name }}

      - name: Cleanup old Docker images
        run: |
          docker image prune -af || true

  cypress:
    name: Cypress E2E Tests
    needs: wp-env-prebuild
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["7.4", "8.3"]
        browser: ["chrome", "firefox", "webkit"]

    services:
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd="wget --spider -q http://localhost:8025 || exit 1"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=10

    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - uses: actions/cache@v3
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('package-lock.json') }}

      - uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - uses: actions/cache@v3
        with:
          path: docker-cache/wp-env-images.tar
          key: wp-env-docker-${{ github.ref_name }}

      - name: Load cached Docker image
        if: steps.restore-cache.outputs.cache-hit == 'true'
        run: docker load -i docker-cache/wp-env-images.tar

      - run: npm ci --engine-strict=false

      # Install WebKit deps & browser only once per PHP version
      - name: Install WebKit system dependencies and browser (Linux)
        if: runner.os == 'Linux' && matrix.browser == 'webkit' && matrix.php == '7.4'
        run: |
          npx playwright install-deps webkit
          npx playwright install webkit

      - uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}

      - run: composer install

      - run: |
          echo "{\"config\": {\"phpVersion\": \"${{ matrix.php }}\"}}" > .wp-env.override.json

      - name: Start WordPress Environment from prebuilt image
        run: docker run -d -p 8889:80 wp-env-prebuilt:latest

      - name: Wait for WordPress to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8889 | grep -q "WordPress"; then
              echo "WordPress is ready"
              break
            fi
            echo "Waiting for WordPress... ($i/30)"
            sleep 5
          done

      - id: tests
        run: npx cypress run --browser ${{ matrix.browser }} --config-file=cypress.config.test.js

      - if: always()
        run: sudo chown -R $USER:$USER tests/e2e/cypress

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ matrix.php }}-${{ matrix.browser }}
          path: tests/e2e/cypress/reports/screenshots

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos-${{ matrix.php }}-${{ matrix.browser }}
          path: tests/e2e/cypress/reports/videos

      - if: failure()
        run: |
          echo "❌ One or more e2e tests failed."
          exit 1

      - if: always()
        run: docker stop $(docker ps -q --filter ancestor=wp-env-prebuilt:latest)

      - if: always()
        run: docker image prune -af || true
